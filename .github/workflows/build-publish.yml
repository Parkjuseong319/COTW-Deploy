name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/parkjuseong319/cotw-deploy-backend:latest
            ghcr.io/parkjuseong319/cotw-deploy-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.cotw.life
          tags: |
            ghcr.io/parkjuseong319/cotw-deploy-frontend:latest
            ghcr.io/parkjuseong319/cotw-deploy-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            cd /home/ubuntu/cotw/backend

            # Pull latest images from GHCR
            sudo docker compose -f docker-compose.prod.yml pull app frontend

            # Recreate containers with the updated images
            sudo docker compose -f docker-compose.prod.yml up -d --no-deps app frontend

            # Remove unused images
            sudo docker image prune -f